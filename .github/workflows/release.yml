# Release Pipeline — the RELEASE-v*.md document is the single source of truth.
#
# Two trigger paths, one invariant:
#   1. Tag push v*            → build, sign, publish that exact tag, body = RELEASE-<tag>.md
#   2. Push to main with the --release vX.Y.Z.W flag in the HEAD commit message
#
# STRICT NOTES RESOLUTION: the job requires the exact RELEASE-<tag>.md in the
# checkout at the release ref. No newest-file fallback. No auto-generated
# notes. If the document is missing, the workflow FAILS — create it, commit,
# push again.
#
# Mirror job: pushing changes to any RELEASE-v*.md on main (rolling the doc
# upward, or editing notes after a release) automatically syncs the matching
# GitHub Release body. No manual `gh release edit` needed.

name: Release Pipeline 📦

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v0.0.0.3)'
        required: true
        default: 'v0.0.0.3'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Build, Sign & Publish Release 🚀
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '--release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Release Trigger & Version 🔍
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            echo "Triggered manually via workflow_dispatch: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            COMMIT_MSG=$(git log -1 --pretty=%B)
            # Match patterns like "--release v0.0.0.1", "--release 0.0.0.1", "[--release v0.0.0.1]"
            if echo "$COMMIT_MSG" | grep -iE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' > /dev/null; then
              EXTRACTED_TAG=$(echo "$COMMIT_MSG" | grep -ioE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | sed -E 's/--release[ =]+//i')
              # Ensure leading 'v'
              if [[ ! "$EXTRACTED_TAG" =~ ^v ]]; then
                EXTRACTED_TAG="v$EXTRACTED_TAG"
              fi
              echo "Detected release flag in HEAD commit: $EXTRACTED_TAG"
              echo "tag=$EXTRACTED_TAG" >> $GITHUB_OUTPUT

              # Create the annotated tag on remote if it does not exist yet
              if ! git rev-parse -q --verify "refs/tags/$EXTRACTED_TAG" >/dev/null; then
                echo "Creating and pushing annotated tag $EXTRACTED_TAG"
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git tag -a "$EXTRACTED_TAG" -m "Release $EXTRACTED_TAG"
                git push origin "$EXTRACTED_TAG"
              fi
            else
              echo "No tag push and no --release flag in the HEAD commit — release job skipped."
              echo "skip=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Locate Release Notes (STRICT — exact version match) 📝
        id: release_notes
        if: steps.detect.outputs.tag != ''
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          RELEASE_FILE="RELEASE-${TAG}.md"
          if [ -f "$RELEASE_FILE" ]; then
            echo "✅ Found the release notes document: $RELEASE_FILE (single source of truth)"
            echo "path=$RELEASE_FILE" >> $GITHUB_OUTPUT
          else
            echo "::error::RELEASE-${TAG}.md is missing at the release ref."
            echo "::error::The release notes document is the single source of truth for this release —"
            echo "::error::no newest-file fallback and no auto-generated notes are permitted."
            echo "::error::Create/rename the release document to RELEASE-${TAG}.md, commit it, and push again."
            exit 1
          fi

      - name: ☕ Setup Java 17 (Zulu)
        if: steps.detect.outputs.tag != ''
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle
        if: steps.detect.outputs.tag != ''
        uses: gradle/actions/setup-gradle@v4

      - name: 🤖 Setup Android SDK
        if: steps.detect.outputs.tag != ''
        run: |
          yes | sdkmanager --licenses || true

      - name: ⚙️ Ensure Gradle Executable
        if: steps.detect.outputs.tag != ''
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: 🛡️ Pre-Flight Test Gate
        if: steps.detect.outputs.tag != ''
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 🔑 Decode Release Keystore
        if: steps.detect.outputs.tag != ''
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          python3 -c "import os, base64; open('my-upload-key.jks', 'wb').write(base64.b64decode(os.environ['SIGNING_KEY'].strip()))"

      - name: 📦 Build & Sign Release AAB (Google Play) & APK (FOSS Sideload)
        if: steps.detect.outputs.tag != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: 🧹 Clean Keystore from Runner
        if: always() && steps.detect.outputs.tag != ''
        run: rm -f my-upload-key.jks

      - name: 🏷️ Prepare Branded Release Artifacts (shellguard-mobile)
        if: steps.detect.outputs.tag != ''
        run: |
          TAG="${{ steps.detect.outputs.tag }}"
          mkdir -p dist
          # Find generated AAB and APK files
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)

          echo "Found AAB at: $AAB_SRC"
          echo "Found APK at: $APK_SRC"

          cp "$AAB_SRC" "dist/shellguard-mobile-${TAG}.aab"
          cp "$APK_SRC" "dist/shellguard-mobile-${TAG}.apk"
          cp "$AAB_SRC" "dist/shellguard-mobile.aab"
          cp "$APK_SRC" "dist/shellguard-mobile.apk"

      - name: 📤 Upload Build Artifacts (Actions Dashboard)
        if: steps.detect.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: shellguard-mobile-${{ steps.detect.outputs.tag }}
          path: |
            dist/shellguard-mobile-${{ steps.detect.outputs.tag }}.aab
            dist/shellguard-mobile-${{ steps.detect.outputs.tag }}.apk
            dist/shellguard-mobile.aab
            dist/shellguard-mobile.apk
          retention-days: 14

      - name: Publish GitHub Release 🚀
        if: steps.detect.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.detect.outputs.tag }}
          name: ShellGuard Mobile ${{ steps.detect.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          files: |
            dist/shellguard-mobile-${{ steps.detect.outputs.tag }}.aab
            dist/shellguard-mobile-${{ steps.detect.outputs.tag }}.apk

  mirror:
    name: Mirror RELEASE Document into the GitHub Release 🪞
    needs: [release]
    if: |
      always() &&
      github.event_name != 'workflow_dispatch' &&
      !contains(needs.release.result, 'failure') &&
      !contains(needs.release.result, 'cancelled') &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        contains(github.event.head_commit.message, '--release') ||
        contains(toJSON(github.event.commits), 'RELEASE-v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror Changed Release Documents 🪞
        run: |
          # 1. If triggered by tag push v*
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [ -f "RELEASE-${TAG}.md" ]; then
              CHANGED="RELEASE-${TAG}.md"
            fi
          # 2. If triggered by commit with --release
          elif echo "$(git log -1 --pretty=%B)" | grep -iE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' > /dev/null; then
            COMMIT_MSG=$(git log -1 --pretty=%B)
            TAG=$(echo "$COMMIT_MSG" | grep -ioE -- '--release[ =]+v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | sed -E 's/--release[ =]+//i')
            [[ ! "$TAG" =~ ^v ]] && TAG="v$TAG"
            if [ -f "RELEASE-${TAG}.md" ]; then
              CHANGED="RELEASE-${TAG}.md"
            fi
          # 3. If triggered by git diff on main touching RELEASE-v*.md
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED=$(ls -1 RELEASE-v*.md 2>/dev/null || true)
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'RELEASE-v*.md' || true)
            fi
          fi

          CHANGED=$(echo "$CHANGED" | grep -v '^$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No release documents changed — nothing to mirror."
            exit 0
          fi

          for FILE in $CHANGED; do
            if [ ! -f "$FILE" ]; then
              echo "↩︎ $FILE no longer exists (release document rolled upward) — skipping."
              continue
            fi

            TAG=$(basename "$FILE" .md | sed 's/^RELEASE-//')
            case "$TAG" in
              v[0-9]*) ;;
              *) echo "Skip $FILE — filename does not encode a vX.Y.Z.W tag."; continue ;;
            esac

            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "ℹ️  $FILE has no tag $TAG on this repository yet — skipping."
              echo "   It will be used automatically when the $TAG tag is pushed."
              continue
            fi

            echo "🪞 Mirroring $FILE → GitHub Release $TAG"
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release edit "$TAG" --notes-file "$FILE"
              echo "✅ Updated release notes for $TAG"
            else
              gh release create "$TAG" --verify-tag --title "ShellGuard Mobile $TAG" --notes-file "$FILE"
              echo "✅ Created release $TAG from $FILE"
            fi
          done
