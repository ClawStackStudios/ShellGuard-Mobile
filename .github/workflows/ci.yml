name: Continuous Integration & Verification 🧪

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'chore/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test_and_build:
    name: Test & Debug Build (Cloud Runner) 🚀
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code 🛡️
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐘 Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🤖 Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: ⚙️ Ensure Gradle Executable
        run: |
          chmod +x gradlew

      - name: 📜 Audit Documentation Drift
        run: |
          python3 scripts/audit_docs_drift.py

      - name: 🧪 Run Unit & Robolectric Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon

      - name: 🔨 Compile Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shellguard-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
